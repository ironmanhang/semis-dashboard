 const n=Math.max(...series.map(s=>s.pts.length));const x=i=>L+(n<2?0:i*(W-L-R)/(n-1)),y=v=>T+(hi-v)*(H-T-B)/(hi-lo);let g="";const ends=[];

 const lab=series[0].pts;(n>=8?[0,Math.floor((n-1)/2),n-1]:[0,n-1]).forEach((i,k,a)=>{if(lab[i])g+=`<text x="${x(i)}" y="${H-6}" text-anchor="${k==0?"start":k==a.length-1?"end":"middle"}" font-size="11" fill="var(--muted)">${lab[i].t}</text>`});
 series.forEach((s,k)=>{const pts=s.pts.map((p,i)=>p.v==null?null:[x(i),y(p.v)]).filter(Boolean);g+=`<polyline fill="none" stroke="${colors[k]}" stroke-width="2" stroke-linejoin="round" points="${pts.map(p=>p.join(",")).join(" ")}"/>`;
  const last=pts[pts.length-1];if(last){g+=`<circle cx="${last[0]}" cy="${last[1]}" r="4" fill="${colors[k]}" stroke="var(--surface)" stroke-width="2"/>`;ends.push({x:last[0],y:last[1],name:s.name.replace("_top5","")})}});
 if(series.length>1){ends.sort((a,b)=>a.y-b.y);for(let i=1;i<ends.length;i++)if(ends[i].y-ends[i-1].y<13)ends[i].y=ends[i-1].y+13;const over=ends.length?ends[ends.length-1].y-(H-B):0;if(over>0)ends.forEach(e=>e.y-=over);

 host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg><div class="tip"></div>`;const tip=host.querySelector(".tip"),hit=document.getElementById(el+"h"),xl=document.getElementById(el+"x");
 hit.addEventListener("mousemove",e=>{const b=hit.getBoundingClientRect();const i=Math.max(0,Math.min(n-1,Math.round((e.clientX-b.left)/b.width*(n-1))));xl.setAttribute("x1",x(i));xl.setAttribute("x2",x(i));xl.style.display="";

  tip.style.display="block";const hb=host.getBoundingClientRect();let lx=e.clientX-hb.left+12;if(lx+tip.offsetWidth>hb.width)lx=e.clientX-hb.left-tip.offsetWidth-12;tip.style.left=lx+"px";tip.style.top=(e.clientY-hb.top+12)+"px"});
